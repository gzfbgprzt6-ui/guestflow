<!DOCTYPE html>
<html lang="hr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Registracija — Odmoria</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=DM+Serif+Display:ital@0;1&family=DM+Sans:opsz,wght@9..40,300;9..40,400;9..40,500;9..40,600&display=swap" rel="stylesheet">
<style>
:root{--black:#0A0A0A;--warm-white:#F7F5F1;--pure-white:#FFFFFF;--electric:#2D5BE3;--stone:#E8E2D9;--ink:#1A1917;--soft:#6B6560;--ghost:#9B9590;--serif:'DM Serif Display',Georgia,serif;--sans:'DM Sans',system-ui,sans-serif}
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
body{font-family:var(--sans);background:var(--warm-white);color:var(--ink);-webkit-font-smoothing:antialiased;min-height:100dvh;display:grid;place-items:center;padding:20px}
.card{background:var(--pure-white);border:1px solid var(--stone);border-radius:16px;padding:36px 32px;width:100%;max-width:400px}
.logo{font-family:var(--serif);font-size:22px;color:var(--black);margin-bottom:28px}
h1{font-family:var(--serif);font-size:26px;font-weight:400;color:var(--black);margin-bottom:6px;letter-spacing:-.01em}
.sub{font-size:14px;color:var(--soft);font-weight:300;margin-bottom:28px;line-height:1.5}
.free-pill{display:inline-flex;align-items:center;gap:7px;background:var(--warm-white);border:1px solid var(--stone);border-radius:20px;padding:5px 12px;font-size:12px;font-weight:500;color:var(--ink);margin-bottom:20px}
.free-dot{width:6px;height:6px;border-radius:50%;background:#16A34A}
.fg{margin-bottom:14px}
.fl{display:block;font-size:11px;font-weight:500;letter-spacing:.07em;text-transform:uppercase;color:var(--ghost);margin-bottom:5px}
.fi{width:100%;padding:10px 13px;border:1px solid var(--stone);border-radius:8px;font-size:14px;color:var(--ink);font-family:var(--sans);transition:border-color .15s}
.fi:focus{outline:none;border-color:var(--electric)}
.btn-main{width:100%;padding:12px;border-radius:8px;background:var(--black);color:#fff;font-size:14px;font-weight:500;border:none;cursor:pointer;font-family:var(--sans);transition:background .12s;margin-top:4px}
.btn-main:hover{background:#222}
.divider{display:flex;align-items:center;gap:12px;margin:18px 0;color:var(--ghost);font-size:13px}
.divider::before,.divider::after{content:'';flex:1;height:1px;background:var(--stone)}
.btn-google{width:100%;padding:11px;border-radius:8px;background:var(--pure-white);border:1px solid var(--stone);font-size:14px;font-weight:400;color:var(--ink);cursor:pointer;font-family:var(--sans);display:flex;align-items:center;justify-content:center;gap:10px;transition:border-color .15s}
.btn-google:hover{border-color:var(--stone-mid)}
.alert{border-radius:8px;padding:11px 13px;font-size:13.5px;margin-bottom:14px;display:none;line-height:1.5}
.alert-err{background:#FEF2F2;border:1px solid #FECACA;color:#B91C1C}
.alert-ok{background:#F0FDF4;border:1px solid #BBF7D0;color:#15803D}
.legal{font-size:12px;color:var(--ghost);font-weight:300;text-align:center;margin-top:14px;line-height:1.6}
.legal a{color:var(--electric)}
.bottom-link{text-align:center;font-size:13.5px;color:var(--soft);margin-top:20px;font-weight:300}
.bottom-link a{color:var(--electric);font-weight:500}
</style>
</head>
<body>
<div class="card">
  <div class="logo">Odmoria</div>
  <div class="free-pill"><span class="free-dot"></span>Free plan — 1 objekt, zauvijek besplatno.</div>
  <h1>Kreiraj račun.</h1>
  <p class="sub">Postavi prvi gostinski vodič za manje od 10 minuta.</p>
  <div class="alert" id="alert"></div>
  <div class="fg"><label class="fl">Ime</label><input class="fi" id="name" placeholder="Ana" autocomplete="given-name"></div>
  <div class="fg"><label class="fl">Email</label><input class="fi" id="email" type="email" placeholder="tvoj@email.com" autocomplete="email"></div>
  <div class="fg"><label class="fl">Lozinka</label><input class="fi" id="pass" type="password" placeholder="Min. 8 znakova" autocomplete="new-password"></div>
  <button class="btn-main" onclick="register()">Kreiraj račun →</button>
  <div class="divider">ili</div>
  <button class="btn-google" onclick="loginGoogle()"><span>G</span> Nastavi s Googleom</button>
  <div class="legal">Kreiranjem računa prihvaćaš <a href="/terms.html">Uvjete</a> i <a href="/privacy.html">Pravila privatnosti</a>.</div>
  <div class="bottom-link">Već imaš račun? <a href="/login.html">Prijavi se</a></div>
</div>

<script type="module">
import{createClient}from'https://esm.sh/@supabase/supabase-js@2'
const sb=createClient('https://wtojzqjhipdfbrnmprmz.supabase.co','sb_publishable_tmZAZTDbQ7ktc1N-8y4q4w_ztAu_62F')

function showA(type,msg){const el=document.getElementById('alert');el.className='alert alert-'+type;el.textContent=msg;el.style.display='block'}

window.register=async()=>{
  const name=document.getElementById('name').value.trim()
  const email=document.getElementById('email').value.trim()
  const pass=document.getElementById('pass').value
  if(!email||!pass){showA('err','Upiši email i lozinku.');return}
  if(pass.length<8){showA('err','Lozinka mora imati najmanje 8 znakova.');return}
  const{error}=await sb.auth.signUp({email,password:pass,options:{data:{full_name:name},emailRedirectTo:location.origin+'/email-confirm.html'}})
  if(error){showA('err',error.message);return}
  showA('ok','✓ Račun kreiran! Provjeri email za potvrdu, zatim se prijavi.')
}

window.loginGoogle=async()=>{
  const{error}=await sb.auth.signInWithOAuth({provider:'google',options:{redirectTo:location.origin+'/dashboard.html'}})
  if(error)showA('err',error.message)
}
</script>
</body>
</html>
