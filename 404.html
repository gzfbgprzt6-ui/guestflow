<!DOCTYPE html>
<html lang="hr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Stranica nije pronađena — Odmoria</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=DM+Sans:opsz,wght@9..40,400;9..40,500;9..40,600;9..40,700&display=swap" rel="stylesheet">
<style>
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
body{font-family:'DM Sans',system-ui,sans-serif;background:#F5F4F1;color:#1A1917;min-height:100dvh;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:24px;text-align:center;-webkit-font-smoothing:antialiased}
.logo{font-size:20px;font-weight:800;letter-spacing:-.5px;margin-bottom:40px}
.logo span{color:#A15C3E}
.emoji{font-size:64px;margin-bottom:20px;display:block}
h1{font-size:28px;font-weight:800;letter-spacing:-.02em;margin-bottom:10px}
p{font-size:15px;color:#6B6A67;line-height:1.65;max-width:380px;margin:0 auto 28px}
.btns{display:flex;flex-direction:column;gap:10px;align-items:center}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:7px;font-weight:700;border-radius:10px;padding:12px 24px;font-size:14px;border:none;cursor:pointer;text-decoration:none;font-family:inherit}
.btn-ink{background:#5A3323;color:#fff}
.btn-out{background:#fff;color:#1A1917;border:1.5px solid #E2E0DB}
</style>
</head>
<body>
<div class="logo">Odmor<span>ia</span></div>
<span class="emoji">🏖️</span>
<h1>Stranica nije pronađena</h1>
<p>Ova stranica ne postoji ili je uklonjena. Ako si dobio link od domaćina, zamoli ga za novi.</p>
<div class="btns">
  <a href="/" class="btn btn-ink">← Na početnu</a>
  <a href="/register.html" class="btn btn-out">Kreiraj svoju stranicu</a>
</div>
</body>
</html>
