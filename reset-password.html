<!DOCTYPE html>
<html lang="hr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Nova lozinka — Odmoria</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
body{font-family:'Plus Jakarta Sans',system-ui,sans-serif;background:#F5F4F1;color:#1A1917;min-height:100dvh;display:flex;flex-direction:column;-webkit-font-smoothing:antialiased}
a{color:inherit;text-decoration:none}
nav{background:#fff;border-bottom:1px solid #E2E0DB;display:flex;align-items:center;padding:0 24px;height:58px}
.logo{font-size:18px;font-weight:800;letter-spacing:-.5px}
.logo span{color:#1A56DB}
.main{flex:1;display:flex;align-items:center;justify-content:center;padding:32px 16px}
.card{background:#fff;border:1px solid #E2E0DB;border-radius:16px;padding:36px 32px;width:100%;max-width:420px;box-shadow:0 4px 24px rgba(0,0,0,.06)}
.card-title{font-size:22px;font-weight:800;letter-spacing:-.02em;margin-bottom:6px}
.card-sub{font-size:14px;color:#6B6A67;margin-bottom:24px;line-height:1.6}
.fg{margin-bottom:16px}
.fg label{display:block;font-size:11px;font-weight:700;letter-spacing:.08em;text-transform:uppercase;color:#6B6A67;margin-bottom:6px}
.fg input{width:100%;padding:11px 14px;border:1.5px solid #E2E0DB;border-radius:10px;font-size:15px;color:#1A1917;background:#fff;transition:border-color .15s;font-family:inherit}
.fg input:focus{outline:none;border-color:#1A56DB}
.fg input.err{border-color:#EF4444}
.btn{width:100%;padding:13px;border-radius:10px;font-size:15px;font-weight:700;background:#1A56DB;color:#fff;border:none;cursor:pointer;transition:background .15s;font-family:inherit;display:flex;align-items:center;justify-content:center;gap:8px}
.btn:hover{background:#1343B0}
.btn:disabled{opacity:.6;cursor:not-allowed}
.alert{border-radius:10px;padding:13px 16px;font-size:14px;font-weight:500;margin-bottom:16px;display:none;line-height:1.5}
.alert-err{background:#FEF2F2;border:1px solid #FECACA;color:#B91C1C}
.alert-ok{background:#F0FDF4;border:1px solid #BBF7D0;color:#15803D}
.hint{font-size:12px;color:#6B6A67;margin-top:5px}
.strength{height:4px;border-radius:2px;margin-top:6px;transition:all .3s;background:#E2E0DB}
.strength.weak{background:#EF4444;width:33%}
.strength.medium{background:#F59E0B;width:66%}
.strength.strong{background:#22C55E;width:100%}
.spinner{width:18px;height:18px;border:2.5px solid rgba(255,255,255,.35);border-top-color:#fff;border-radius:50%;animation:spin .7s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}
</style>
</head>
<body>
<nav><a href="/" class="logo">Odmor<span>ia</span></a></nav>
<div class="main">
  <div class="card">
    <div class="card-title">Nova lozinka</div>
    <div class="card-sub">Upiši novu lozinku za svoj Odmoria račun.</div>
    <div class="alert alert-err" id="alert-err"></div>
    <div class="alert alert-ok" id="alert-ok"></div>
    <div id="form-wrap">
      <div class="fg">
        <label>Nova lozinka</label>
        <input type="password" id="pass1" placeholder="Najmanje 8 znakova" autocomplete="new-password">
        <div class="strength" id="strength-bar"></div>
        <div class="hint" id="strength-lbl"></div>
      </div>
      <div class="fg">
        <label>Ponovi lozinku</label>
        <input type="password" id="pass2" placeholder="Ista lozinka još jednom" autocomplete="new-password">
      </div>
      <button class="btn" id="submit-btn" onclick="submit()">
        <span id="btn-text">Postavi novu lozinku →</span>
      </button>
    </div>
  </div>
</div>

<script type="module">
import { createClient } from 'https://esm.sh/@supabase/supabase-js@2'

const sb = createClient(
  'https://wtojzqjhipdfbrnmprmz.supabase.co',
  'sb_publishable_tmZAZTDbQ7ktc1N-8y4q4w_ztAu_62F'
)

// Supabase injects session from URL hash automatically
// We just need to catch the PASSWORD_RECOVERY event
const { data: { session } } = await sb.auth.getSession()
if (!session) {
  // Wait for hash-based session
  sb.auth.onAuthStateChange((event, session) => {
    if (event === 'PASSWORD_RECOVERY') {
      // Good — user clicked the reset link
      console.log('Password recovery mode')
    } else if (!session) {
      showErr('Link je istekao ili nije valjan. Zatraži novi reset lozinke.')
      document.getElementById('form-wrap').style.display = 'none'
    }
  })
}

// password strength indicator
document.getElementById('pass1').addEventListener('input', e => {
  const v = e.target.value
  const bar = document.getElementById('strength-bar')
  const lbl = document.getElementById('strength-lbl')
  bar.className = 'strength'
  if (!v) { lbl.textContent = ''; return }
  if (v.length < 8) { bar.classList.add('weak'); lbl.textContent = 'Prekratka lozinka'; return }
  const strong = /[A-Z]/.test(v) && /[0-9]/.test(v) && v.length >= 12
  const medium = v.length >= 8
  if (strong) { bar.classList.add('strong'); lbl.textContent = 'Jaka lozinka ✓' }
  else if (medium) { bar.classList.add('medium'); lbl.textContent = 'Dobra lozinka' }
})

window.submit = async () => {
  const p1 = document.getElementById('pass1').value
  const p2 = document.getElementById('pass2').value
  const btn = document.getElementById('submit-btn')
  const txt = document.getElementById('btn-text')

  document.getElementById('alert-err').style.display = 'none'

  if (p1.length < 8) { showErr('Lozinka mora imati najmanje 8 znakova.'); return }
  if (p1 !== p2) { showErr('Lozinke se ne podudaraju.'); return }

  btn.disabled = true
  txt.innerHTML = '<div class="spinner"></div> Postavljam...'

  const { error } = await sb.auth.updateUser({ password: p1 })

  if (error) {
    btn.disabled = false
    txt.textContent = 'Postavi novu lozinku →'
    showErr(error.message)
    return
  }

  document.getElementById('alert-ok').textContent = '✓ Lozinka je promijenjena! Preusmjeravam na dashboard...'
  document.getElementById('alert-ok').style.display = 'block'
  document.getElementById('form-wrap').style.display = 'none'

  setTimeout(() => window.location.href = '/dashboard.html', 2000)
}

function showErr(msg) {
  const el = document.getElementById('alert-err')
  el.textContent = msg
  el.style.display = 'block'
}
</script>
</body>
</html>
